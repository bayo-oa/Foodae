<div class="menu-row{% if not item.is_available %} unavailable{% endif %}">
    <span class="menu-row-name">{{ item.name }}</span>
    <span class="menu-row-leader" aria-hidden="true"></span>
    <span class="menu-row-price">₦{{ "%.0f"|format(item.price) }}</span>
    {% if item.is_available %}
    <span class="menu-row-actions">
        <form method="POST" action="{{ url_for('customer.add_to_cart', food_item_id=item.id) }}">
            <input type="number" name="quantity" value="1" min="1" aria-label="Quantity">
            <button type="submit" class="btn-sm">Add</button>
        </form>
    </span>
    {% endif %}
    {% if item.description %}<span class="menu-row-desc">{{ item.description }}</span>{% endif %}
</div>
