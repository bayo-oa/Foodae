<div class="card">
    {% if item.image_url %}<img src="{{ item.image_url }}" style="width:100%; height:120px; object-fit:cover; border-radius:6px;">{% endif %}
    <strong>{{ item.name }}</strong>
    <div style="font-size:0.85rem; color:#888;">{{ item.description or '' }}</div>
    <div>₦{{ "%.2f"|format(item.price) }}</div>
    <form method="POST" action="{{ url_for('customer.add_to_cart', food_item_id=item.id) }}" style="flex-direction:row; margin-top:8px;">
        <input type="number" name="quantity" value="1" min="1" style="width:60px;">
        <button type="submit" class="btn-sm">Add to Cart</button>
    </form>
</div>
