{% extends "base.html" %}
{% block title %}Restaurant Settings{% endblock %}
{% block content %}
<h2>Restaurant Settings</h2>
<form method="POST" enctype="multipart/form-data">
    <label>Name</label>
    <input type="text" name="name" value="{{ restaurant.name }}">
    <label>Description</label>
    <textarea name="description" rows="3">{{ restaurant.description or '' }}</textarea>
    <label>Address</label>
    <input type="text" name="address" value="{{ restaurant.address or '' }}">
    <label>Opening hours</label>
    <input type="text" name="opening_hours" value="{{ restaurant.opening_hours or '' }}" placeholder="e.g. Mon-Sun 9am-9pm">
    <label>Delivery fee (₦)</label>
    <input type="number" step="0.01" name="delivery_fee" value="{{ restaurant.delivery_fee }}">
    <label>Minimum order amount (₦)</label>
    <input type="number" step="0.01" name="minimum_order_amount" value="{{ restaurant.minimum_order_amount }}">
    <label><input type="checkbox" name="is_open" {% if restaurant.is_open %}checked{% endif %} style="width:auto;"> Restaurant is open</label>
    <label>Logo</label>
    <input type="file" name="logo" accept="image/*">
    <label>Cover image</label>
    <input type="file" name="cover_image" accept="image/*">
    <button type="submit">Save Settings</button>
</form>
{% endblock %}
